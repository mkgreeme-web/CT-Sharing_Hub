<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가치 매트릭스</title>
    <!-- 핵심 라이브러리 로드 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 이미지/PDF 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        /* A4 비율을 고려한 캡처 영역 설정 */
        .capture-area { 
            background: white; 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px;
        }
        .matrix-table th, .matrix-table td { border: 1px solid #e2e8f0; text-align: center; }
        .matrix-table th { background-color: #f8fafc; color: #475569; font-weight: 700; }
        @media print { .no-print { display: none; } }
        .modal-enter { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const VALUE_LIST = [
            "가족", "감사", "건강", "결단", "경제적 안정", "공헌", "관계", "관대함", "권력", "교육", 
            "균형", "긍정적 태도", "끈기", "기술", "나눔", "다양성", "단순성", "도덕성", "도전", "독창성", 
            "리더십", "명성", "모험", "미래", "발전", "배려", "봉사", "부유함", "성공", 
            "성실", "성장", "승리", "신념", "신뢰", "신앙", "아름다움", "안정", "애국심", "애정", 
            "여유", "열정", "완벽", "완성", "영성", "영향력", "용기", "용서", "외모", 
            "우정", "유머", "윤리", "겸손", "의지력", "인내", "인정", "자발성", "자비", "자유", 
            "자율성", "적극성", "전문성", "절약", "절제", "정서적 안정", "정의", "정직", 
            "존경", "존중", "즐거운 삶", "직업적 성취", "사회적 지위", "기여", "친밀감", 
            "진실성", "지식", "지혜", "창의", "충성", "탁월성", "팀워크", "쾌활함", "품질", "평화", 
            "프로정신", "학습", "혁신", "하모니", "호기심", "환경"
        ];

        function App() {
            const [phase, setPhase] = useState('SELECTION');
            const [selectedValues, setSelectedValues] = useState([]);
            const [matrix, setMatrix] = useState({});
            const [activeCompare, setActiveCompare] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [showManual, setShowManual] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const resultRef = useRef(null);

            const toggleValue = (val) => {
                if (selectedValues.includes(val)) {
                    setSelectedValues(selectedValues.filter(v => v !== val));
                } else if (selectedValues.length < 10) {
                    setSelectedValues([...selectedValues, val]);
                }
            };

            const startComparison = () => {
                setPhase('COMPARISON');
                findNextComparison({});
            };

            const findNextComparison = (currentMatrix) => {
                for (let j = 0; j < 9; j++) {
                    for (let i = j + 1; i < 10; i++) {
                        if (currentMatrix[`${i}-${j}`] === undefined) {
                            setActiveCompare({ row: i, col: j });
                            setShowModal(true);
                            return;
                        }
                    }
                }
                setPhase('RESULT');
            };

            const handleWinner = (winnerIdx) => {
                const newMatrix = { ...matrix, [`${activeCompare.row}-${activeCompare.col}`]: winnerIdx };
                setMatrix(newMatrix);
                setShowModal(false);
                setTimeout(() => findNextComparison(newMatrix), 100);
            };

            const calculateFullStats = () => {
                const counts = Array(10).fill(0);
                Object.values(matrix).forEach(idx => counts[idx]++);
                const mapped = selectedValues.map((name, index) => ({
                    id: index + 1,
                    name,
                    score: counts[index]
                }));
                const sorted = [...mapped].sort((a, b) => b.score - a.score);
                return mapped.map(item => {
                    const rank = sorted.findIndex(s => s.id === item.id) + 1;
                    return { ...item, rank };
                });
            };

            const getDateString = () => {
                const now = new Date();
                return `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
            };

            const exportAsImage = async () => {
                setIsExporting(true);
                const canvas = await html2canvas(resultRef.current, { scale: 2, useCORS: true });
                const link = document.createElement('a');
                link.download = `Value_Matrix_Report_CiT_${getDateString()}.png`;
                link.href = canvas.toDataURL();
                link.click();
                setIsExporting(false);
            };

            const exportAsPDF = async () => {
                setIsExporting(true);
                const canvas = await html2canvas(resultRef.current, { 
                    scale: 3, 
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });
                
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;
                
                let ratio = pdfWidth / imgWidth;
                let finalWidth = pdfWidth;
                let finalHeight = imgHeight * ratio;
                
                if (finalHeight > pdfHeight) {
                    ratio = pdfHeight / imgHeight;
                    finalHeight = pdfHeight;
                    finalWidth = imgWidth * ratio;
                }
                
                const xOffset = (pdfWidth - finalWidth) / 2;
                pdf.addImage(imgData, 'PNG', xOffset, 0, finalWidth, finalHeight);
                pdf.save(`Value_Matrix_Report_CiT_${getDateString()}.pdf`);
                setIsExporting(false);
            };

            const stats = phase === 'RESULT' ? calculateFullStats() : [];
            const topValues = stats.filter(s => s.rank <= 3).sort((a, b) => a.rank - b.rank);
            const nextValues = stats.filter(s => s.rank >= 4 && s.rank <= 6).sort((a, b) => a.rank - b.rank);
            const progress = (Object.keys(matrix).length / 45) * 100;

            return (
                <div className="py-8 px-4 max-w-5xl mx-auto flex flex-col min-h-screen">
                    <div className="flex-1">
                        <div className="flex justify-between items-start mb-8 no-print">
                            <div>
                                <h1 className="text-3xl font-black text-indigo-600 mb-1">가치 매트릭스</h1>
                                <p className="text-slate-400 font-medium">내면의 기준을 세우는 진단 도구</p>
                            </div>
                            <button 
                                onClick={() => setShowManual(true)}
                                className="bg-white border border-slate-200 px-4 py-2 rounded-full text-sm font-bold text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-2 shadow-sm"
                            >
                                <span className="bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px]">?</span>
                                가이드
                            </button>
                        </div>

                        {phase === 'SELECTION' && (
                            <div className="bg-white rounded-3xl p-8 shadow-xl no-print">
                                <h2 className="text-xl font-bold mb-6 text-slate-700">당신의 핵심 가치 10개를 선택하세요 ({selectedValues.length}/10)</h2>
                                <div className="flex flex-wrap gap-2 mb-8">
                                    {VALUE_LIST.map(val => (
                                        <button key={val} onClick={() => toggleValue(val)}
                                            className={`px-4 py-2 rounded-xl text-sm transition-all border ${selectedValues.includes(val) ? 'bg-indigo-600 border-indigo-600 text-white font-bold shadow-md' : 'bg-white border-slate-200 text-slate-500 hover:border-indigo-300'}`}>
                                            {val}
                                        </button>
                                    ))}
                                </div>
                                <div className="text-center">
                                    <button disabled={selectedValues.length < 10} onClick={startComparison}
                                        className={`w-full max-w-md py-4 rounded-2xl font-black text-xl shadow-2xl transition-all ${selectedValues.length === 10 ? 'bg-indigo-600 text-white animate-bounce' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                        진단 시작하기
                                    </button>
                                </div>
                            </div>
                        )}

                        {phase === 'COMPARISON' && (
                            <div className="bg-white rounded-3xl p-12 shadow-xl text-center no-print">
                                <h2 className="text-2xl font-black text-slate-700 mb-6 italic tracking-widest">ANALYZING...</h2>
                                <div className="w-full bg-slate-100 h-6 rounded-full mb-4 overflow-hidden shadow-inner">
                                    <div className="bg-indigo-500 h-full transition-all duration-300" style={{width: `${progress}%`}}></div>
                                </div>
                                <p className="text-indigo-400 font-black text-lg">{Math.round(progress)}% 완료되었습니다</p>
                            </div>
                        )}

                        {phase === 'RESULT' && (
                            <div className="flex flex-col gap-8 pb-10">
                                <div ref={resultRef} className="capture-area rounded-[2.5rem] shadow-sm border border-slate-100">
                                    <div className="text-center mb-10 border-b-4 border-slate-50 pb-8">
                                        <h1 className="text-4xl font-black text-slate-900 mb-2 tracking-tighter">VALUE MATRIX REPORT</h1>
                                        <p className="text-indigo-600 font-bold tracking-[0.4em] uppercase text-[10px]">개인 가치 우선순위 정밀 진단 결과지</p>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 mb-12">
                                        {topValues.map((res, i) => (
                                            <div key={i} className={`p-6 rounded-[2rem] text-center shadow-md transition-all ${res.rank === 1 ? 'bg-indigo-600 text-white scale-105' : 'bg-indigo-50 text-indigo-800'}`}>
                                                <div className="text-[9px] font-black opacity-50 uppercase mb-1 tracking-widest">Rank {res.rank}</div>
                                                <div className="text-xl font-black">{res.name}</div>
                                                <div className="text-[10px] font-bold mt-1 opacity-50">{res.score} Points</div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mb-12">
                                        <h3 className="text-lg font-black mb-4 flex items-center gap-2">
                                            <span className="w-1.5 h-6 bg-indigo-600 rounded-full"></span>
                                            ① 가치매트릭스 상세 데이터
                                        </h3>
                                        <div className="overflow-hidden rounded-xl border border-slate-100 shadow-sm">
                                            <table className="matrix-table w-full text-[10px]">
                                                <thead>
                                                    <tr className="bg-slate-50">
                                                        <th className="p-2 w-12">No</th>
                                                        {selectedValues.map((_, i) => <th key={i} className="p-2">{i+1}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {selectedValues.map((rowV, i) => (
                                                        <tr key={i}>
                                                            <th className="p-2 font-black bg-slate-50 text-slate-400">{i+1}</th>
                                                            {selectedValues.map((_, j) => {
                                                                const winner = matrix[`${i}-${j}`];
                                                                const isLower = i > j;
                                                                return (
                                                                    <td key={j} className={`p-2 h-10 ${!isLower ? 'bg-slate-50/20' : 'bg-white font-black text-indigo-600 text-base'}`}>
                                                                        {isLower ? (winner !== undefined ? (winner + 1) : '') : (i === j ? '＼' : '')}
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <h3 className="text-lg font-black mb-4 flex items-center gap-2">
                                            <span className="w-1.5 h-6 bg-indigo-600 rounded-full"></span>
                                            ② 종합 가치 점수 및 순위
                                        </h3>
                                        <div className="grid md:grid-cols-2 gap-3 mb-4">
                                            <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4">
                                                <p className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2">Top Values 1-3</p>
                                                <p className="text-sm font-black text-indigo-800 leading-relaxed">최상위 가치 3개: {topValues.map(v => `${v.rank}. ${v.name}`).join(', ')}</p>
                                            </div>
                                            <div className="bg-yellow-50 border border-yellow-100 rounded-2xl p-4">
                                                <p className="text-[10px] font-black text-yellow-500 uppercase tracking-widest mb-2">Next Values 4-6</p>
                                                <p className="text-sm font-black text-yellow-900 leading-relaxed">차상위 가치 3개: {nextValues.map(v => `${v.rank}. ${v.name}`).join(', ')}</p>
                                            </div>
                                        </div>
                                        <div className="rounded-xl border border-slate-50 overflow-hidden shadow-sm">
                                            <table className="w-full text-xs">
                                                <thead className="bg-slate-50 border-b border-slate-100">
                                                    <tr>
                                                        <th className="p-3 text-left text-slate-400 font-bold">No</th>
                                                        <th className="p-3 text-left font-black text-slate-700">핵심 가치 리스트</th>
                                                        <th className="p-3 font-black">합계</th>
                                                        <th className="p-3 font-black text-indigo-600">순위</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {stats.map((item, i) => {
                                                        let rankStyle = "bg-slate-100 text-slate-400";
                                                        if (item.rank <= 3) rankStyle = "bg-indigo-600 text-white font-black shadow-md";
                                                        else if (item.rank <= 6) rankStyle = "bg-yellow-400 text-yellow-900 font-black shadow-sm";

                                                        return (
                                                            <tr key={i} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/50">
                                                                <td className="p-3 text-slate-300 font-bold">{item.id}</td>
                                                                <td className={`p-3 font-bold ${item.rank <= 3 ? 'text-indigo-600' : 'text-slate-600'}`}>{item.name}</td>
                                                                <td className="p-3 text-center text-slate-400 font-black">{item.score}</td>
                                                                <td className="p-3 text-center">
                                                                    <span className={`inline-block w-7 h-7 leading-7 rounded-full text-center text-[10px] ${rankStyle}`}>
                                                                        {item.rank}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    
                                </div>

                                <div className="no-print flex flex-col md:flex-row gap-4 max-w-[800px] w-full mx-auto">
                                    <button 
                                        onClick={exportAsPDF} 
                                        disabled={isExporting}
                                        className="flex-1 bg-indigo-600 text-white py-6 rounded-[1.5rem] font-black text-xl shadow-xl hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-3 disabled:opacity-50"
                                    >
                                        <i className="lucide-file-text"></i> PDF 리포트 다운로드
                                    </button>
                                    <button 
                                        onClick={exportAsImage} 
                                        disabled={isExporting}
                                        className="flex-1 bg-slate-900 text-white py-6 rounded-[1.5rem] font-black text-xl shadow-xl hover:bg-black active:scale-95 transition-all flex items-center justify-center gap-3 disabled:opacity-50"
                                    >
                                        <i className="lucide-image"></i> 이미지 저장하기
                                    </button>
                                    <button onClick={() => window.location.reload()} className="bg-white text-slate-400 px-8 py-6 rounded-[1.5rem] font-bold border-2 border-slate-200 hover:bg-slate-50">
                                        다시 하기
                                    </button>
                                </div>
                                {isExporting && <div className="no-print text-center text-indigo-600 font-bold animate-pulse">파일을 생성하는 중입니다...</div>}
                            </div>
                        )}
                    </div>

                    <footer className="no-print py-12 flex justify-between items-center gap-4">
                        <p className="text-slate-400 text-sm font-bold tracking-widest uppercase">All rights reserved by CiT</p>
                        <p className="text-slate-400 text-sm font-bold tracking-widest">Built by MK 컨설팅 & 코칭</p>
                    </footer>

                    {showModal && activeCompare && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-xl flex items-center justify-center z-50 p-6 no-print">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-sm overflow-hidden shadow-2xl modal-enter">
                                <div className="pt-12 px-10 text-center">
                                    <p className="text-indigo-500 font-black text-[10px] tracking-[0.4em] mb-4 uppercase">Value Tournament</p>
                                    <h3 className="text-2xl font-black text-slate-800 mb-10 leading-tight">두 가치 중 <br/><span className="text-indigo-600 underline decoration-indigo-200 decoration-4 underline-offset-4">더 중요한 것</span>은?</h3>
                                    <div className="flex flex-col gap-3">
                                        <button onClick={() => handleWinner(activeCompare.row)} className="w-full py-10 bg-slate-50 rounded-[2rem] text-3xl font-black text-slate-800 hover:bg-indigo-600 hover:text-white transition-all transform active:scale-90 shadow-sm border border-slate-100">
                                            {selectedValues[activeCompare.row]}
                                        </button>
                                        <div className="py-2 text-slate-200 font-black italic text-xl">VS</div>
                                        <button onClick={() => handleWinner(activeCompare.col)} className="w-full py-10 bg-slate-50 rounded-[2rem] text-3xl font-black text-slate-800 hover:bg-indigo-600 hover:text-white transition-all transform active:scale-90 shadow-sm border border-slate-100">
                                            {selectedValues[activeCompare.col]}
                                        </button>
                                    </div>
                                </div>
                                <div className="p-10 text-center bg-slate-50/50 mt-8">
                                    <p className="text-slate-400 text-xs font-bold italic">당신의 직관이 말하는 대로 선택하세요!</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {showManual && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[100] p-6 no-print">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl modal-enter">
                                <div className="p-8">
                                    <div className="flex justify-between items-center mb-8">
                                        <h3 className="text-2xl font-black text-slate-800 underline decoration-indigo-200 decoration-4 underline-offset-8">사용 가이드</h3>
                                        <button onClick={() => setShowManual(false)} className="text-slate-300 hover:text-slate-600 text-3xl font-bold">×</button>
                                    </div>
                                    {phase === 'RESULT' ? (
                                        <div className="space-y-8">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base mb-2">진단 결과의 의미</h4>
                                                <p className="text-xs text-slate-500 leading-relaxed">결과표는 10개의 선택 가치가 서로 직접 비교되었을 때 몇 번 더 중요하게 선택되었는지를 점수화한 것입니다. 점수가 높을수록 현재 의사결정과 삶의 방향에서 더 강하게 작동하는 기준으로 볼 수 있습니다.</p>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">1</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">최상위 가치</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">1~3위 가치는 당신의 핵심 동기와 판단의 중심축입니다. 중요한 선택을 할 때 이 가치들이 충족되는지 확인하면 더 일관된 결정을 내릴 수 있습니다.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-yellow-400 text-yellow-900 w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">2</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">차상위 가치</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">4~6위 가치는 최상위 가치를 보완하는 실천 기준입니다. 목표를 설계하거나 관계와 일의 우선순위를 조정할 때 함께 살피면 균형을 잡는 데 도움이 됩니다.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-slate-900 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">3</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">활용 방법</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">리포트를 저장한 뒤 최근의 선택, 일, 관계, 목표가 상위 가치와 얼마나 맞닿아 있는지 점검해 보세요. 가치가 충돌할 때는 더 높은 순위의 가치가 우선 기준이 됩니다.</p>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-8">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base mb-2">가치 매트릭스란?</h4>
                                                <p className="text-xs text-slate-500 leading-relaxed">가치 매트릭스는 내가 중요하다고 느끼는 가치들을 서로 비교해 현재의 우선순위를 시각화하는 진단 도구입니다. 막연한 선호를 숫자와 순위로 정리해 선택의 기준, 동기, 삶의 방향을 더 선명하게 바라보도록 돕습니다.</p>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">1</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">가치 선정</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">첫 화면에서 지금의 나에게 중요하다고 느껴지는 핵심 가치 10개를 선택합니다. 정답을 찾기보다 현재 마음이 반응하는 단어를 고르는 것이 좋습니다.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">2</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">진단 진행</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">10개를 모두 선택하면 진단을 시작할 수 있습니다. 두 가치가 제시될 때마다 더 중요하거나 더 포기하기 어려운 쪽을 직관적으로 선택하세요.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-5">
                                                <div className="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black shrink-0 shadow-lg">3</div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">결과 확인</h4>
                                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">모든 비교가 끝나면 가치별 점수와 순위가 표시됩니다. 결과 리포트는 PDF 또는 이미지로 저장해 자기 이해, 코칭, 목표 설정 자료로 활용할 수 있습니다.</p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => setShowManual(false)} className="w-full mt-10 bg-slate-900 text-white py-4 rounded-xl font-black text-lg">가이드 확인 완료</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
